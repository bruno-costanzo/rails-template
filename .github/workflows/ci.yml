name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      CHARCO_MOBILE_DEPLOY_KEY: ${{ secrets.CHARCO_MOBILE_DEPLOY_KEY }}

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Let Bundler read the charco_mobile repository
        if: env.CHARCO_MOBILE_DEPLOY_KEY != ''
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.CHARCO_MOBILE_DEPLOY_KEY }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run quality gate
        env:
          RAILS_ENV: test
        run: bin/ci

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
